name: Günlük Instagram Postu

on:
  schedule:
    # Her gün TSİ 10:00'da (UTC 07:00) ve TSİ 18:00'de (UTC 15:00) çalışır
    - cron: "0 7 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}  # GitHub'dan elle de tetiklenebilir

permissions:
  contents: write

jobs:
  post-uret-ve-yayinla:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: |
          pip install playwright anthropic python-dotenv requests
          playwright install --with-deps chromium

      - name: Git kimliğini ayarla
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Ana script'i çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
        run: python main.py

      - name: Takip dosyalarını kaydet
        run: |
          git add kullanilan_konular.json cikti/ gorseller/
          git diff --cached --quiet || git commit -m "otomatik post: $(date +%Y-%m-%d)"
          git push
