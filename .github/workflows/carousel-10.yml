name: 06:00 Carousel Yayını

on:
  schedule:
    # Yaz saati: 04:00 UTC = 06:00 Europe/Berlin
    - cron: "0 4 * * *"

    # Kış saati: 05:00 UTC = 06:00 Europe/Berlin
    - cron: "0 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  carousel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Berlin saatini kontrol et
        id: saat_kontrol
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "calistir=true" >> "$GITHUB_OUTPUT"
            echo "Manuel çalıştırma: workflow devam ediyor."
            exit 0
          fi

          BERLIN_SAATI=$(TZ=Europe/Berlin date +%H)

          if [ "$BERLIN_SAATI" = "06" ]; then
            echo "calistir=true" >> "$GITHUB_OUTPUT"
            echo "Berlin saati 06:00, workflow devam ediyor."
          else
            echo "calistir=false" >> "$GITHUB_OUTPUT"
            echo "Yanlış UTC tetiklemesi, workflow durduruluyor."
          fi

      - name: Python kurulumu
        if: steps.saat_kontrol.outputs.calistir == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini kur
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests
          playwright install --with-deps chromium

      - name: Git ayarlarını yap
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: İçerik üret
        if: steps.saat_kontrol.outputs.calistir == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python icerik_uret.py

      - name: Görsel üret
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          python gorsel_uret.py

      - name: Oluşturulan dosyaları GitHub'a yükle
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          git add kullanilan_konular.json cikti/ gorseller/
          git diff --cached --quiet || \
            git commit -m "carousel: $(date +%Y-%m-%d-%H-%M)"
          git push

      - name: GitHub görsellerinin erişilebilir olmasını bekle
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          sleep 20

      - name: Carousel yayınla
        if: steps.saat_kontrol.outputs.calistir == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
          GITHUB_BRANCH: main
        run: |
          python carousel_yayinla.py

      - name: Yayın sonrası değişiklikleri kaydet
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          git add kullanilan_konular.json cikti/ gorseller/
          git diff --cached --quiet || \
            git commit -m "carousel: yayın sonrası $(date +%Y-%m-%d-%H-%M)"
          git push
