name: 10:00 Carousel Yayını

on:
  schedule:
    - cron: "30 14 * * *"
      timezone: "Europe/Berlin"

jobs:
  carousel:
    # (gerisi aynı, sadece job name'i değişti)
    
    - name: İçerik üret
      # story_uret.py → icerik_uret.py
      run: python icerik_uret.py
    
    - name: Görsel üret
      # (yeni adım)
      run: python gorsel_uret.py
    
    - name: Carousel yayınla
      # story_yayinla.py → carousel_yayinla.py
      run: python carousel_yayinla.py
    
    - name: Değişiklikleri kaydet
      # stories/ → gorseller/
      run: |
        git add kullanilan_konular.json cikti/ gorseller/
        git diff --cached --quiet || git commit -m "carousel: $(date +%Y-%m-%d-%H-%M)"
        git push
