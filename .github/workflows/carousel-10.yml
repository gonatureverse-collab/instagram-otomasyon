name: 10:00 Carousel Yayını

on:
  schedule:
    - cron: "0 06 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carousel-yayin
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi checkout et
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python'u kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests
          playwright install --with-deps chromium

      - name: Git ayarlarını yap
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: İçerik üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python icerik_uret.py

      - name: Görsel üret
        run: |
          python gorsel_uret.py

      - name: Oluşturulan dosyaları GitHub'a yükle
        run: |
          git add kullanilan_konular.json cikti/ gorseller/

          if ! git diff --cached --quiet; then
            git commit -m "carousel: $(date -u +%Y-%m-%d-%H-%M)"
          fi

          git pull --rebase origin main
          git push origin main

      - name: GitHub görsellerinin erişilebilir olmasını bekle
        run: |
          sleep 20

      - name: Carousel yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
        run: |
          python carousel_yayinla.py

      - name: Yayın sonrası değişiklikleri kaydet
        run: |
          git add kullanilan_konular.json cikti/ gorseller/

          if ! git diff --cached --quiet; then
            git commit -m "carousel: yayın sonrası $(date -u +%Y-%m-%d-%H-%M)"
          fi

          git pull --rebase origin main
          git push origin main