name: 08:00 UTC Carousel Yayını

on:
  schedule:
    # Her gün 08:00 UTC
    - cron: "0 8 * * *"

  # Manuel çalıştırma için
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carousel:
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: UTC saatini kontrol et
        run: |
          echo "=== GitHub UTC Saati ==="
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo ""
          echo "Berlin saati:"
          TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z'
          echo ""
          echo "Workflow tetikleyicisi:"
          echo "${{ github.event_name }}"

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests
          playwright install --with-deps chromium

      - name: Git ayarlarını yap
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: İçerik üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python icerik_uret.py

      - name: Görsel üret
        run: |
          python gorsel_uret.py

      - name: Oluşturulan dosyaları GitHub'a yükle
        run: |
          git add kullanilan_konular.json cikti/ gorseller/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "carousel: $(date -u +%Y-%m-%d-%H-%M)"
            git push
          fi

      - name: GitHub görsellerinin erişilebilir olmasını bekle
        run: |
          sleep 20

      - name: Carousel yayınla
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
          GITHUB_BRANCH: main
        run: |
          python carousel_yayinla.py

      - name: Yayın sonrası değişiklikleri kaydet
        run: |
          git add kullanilan_konular.json cikti/ gorseller/

          if git diff --cached --quiet; then
            echo "Yayın sonrası kaydedilecek değişiklik yok."
          else
            git commit -m "carousel: yayın sonrası $(date -u +%Y-%m-%d-%H-%M)"
            git push
          fi
