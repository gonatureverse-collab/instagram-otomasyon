name: 12:00 Reel Yayını

on:
  schedule:
    # Yaz saati: 10:00 UTC = 12:00 Almanya
    - cron: "0 10 * * *"

    # Kış saati: 11:00 UTC = 12:00 Almanya
    - cron: "0 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Almanya saatini kontrol et
        id: saat_kontrol
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "calistir=true" >> "$GITHUB_OUTPUT"
            echo "Manuel çalıştırma: workflow devam ediyor."
            exit 0
          fi

          ALMANYA_SAATI=$(TZ=Europe/Berlin date +%H)

          if [ "$ALMANYA_SAATI" = "12" ]; then
            echo "calistir=true" >> "$GITHUB_OUTPUT"
            echo "Almanya saati 12:00, workflow devam ediyor."
          else
            echo "calistir=false" >> "$GITHUB_OUTPUT"
            echo "Yanlış UTC tetiklemesi, workflow durduruluyor."
          fi

      - name: Python kurulumu
        if: steps.saat_kontrol.outputs.calistir == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri kur
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install playwright anthropic python-dotenv requests moviepy
          playwright install --with-deps chromium

      - name: Git ayarlarını yap
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Reel üret ve yayınla
        if: steps.saat_kontrol.outputs.calistir == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_ENDPOINT: ${{ secrets.AZURE_TTS_ENDPOINT }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
          GITHUB_BRANCH: main
        run: |
          python reel_uret.py

      - name: Değişiklikleri kaydet
        if: steps.saat_kontrol.outputs.calistir == 'true'
        run: |
          git add kullanilan_konular.json cikti/ gorseller/ reels/
          git diff --cached --quiet || \
            git commit -m "reel: $(date +%Y-%m-%d-%H-%M)"
          git push
