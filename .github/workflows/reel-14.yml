name: 10:00 UTC Reel Yayını

on:
  schedule:
    # Her gün 10:00 UTC
    - cron: "0 9 * * *"

  # Manuel çalıştırma
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: UTC saatini kontrol et
        run: |
          echo "=== GitHub UTC Saati ==="
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo ""
          echo "Almanya saati:"
          TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z'
          echo ""
          echo "Workflow tetikleyicisi:"
          echo "${{ github.event_name }}"

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          python -m pip install --upgrade pip

          pip install playwright anthropic python-dotenv requests moviepy

          playwright install --with-deps chromium

      - name: Git ayarlarını yap
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Reel üret ve yayınla
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_ENDPOINT: ${{ secrets.AZURE_TTS_ENDPOINT }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GITHUB_USERNAME: gonatureverse-collab
          GITHUB_REPO: instagram-otomasyon
          GITHUB_BRANCH: main
        run: |
          python reel_uret.py

      - name: Değişiklikleri kaydet
        run: |
          git add kullanilan_konular.json cikti/ gorseller/ reels/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "reel: $(date -u +%Y-%m-%d-%H-%M)"
            git push
          fi
